paths:
  drive_root: /content/drive/MyDrive/agw-sort
  sportsmot_root: /content/drive/MyDrive/agw-sort/data/soccernet-tracking/tracking
  soccernet_root: /content/drive/MyDrive/agw-sort/data/teamtrack-mot/basketball_side
  detections_cache: /content/drive/MyDrive/agw-sort/cache/detections
  results_root: /content/drive/MyDrive/agw-sort/results
  trackeval_repo: /content/TrackEval
detection:
  yolo_weights: yolov8m.pt
  conf_threshold: 0.25
  iou_threshold: 0.7
  person_class_id: 0
  device: cuda
  imgsz: 1280
sort:
  alpha: 1.0
  beta: 0.2
  max_age: 30
  min_hits: 3
  iou_match_threshold: 0.3
agw:
  tau_margin: 0.05
  tau_iou: 0.4
  neighbor_radius_px: 80
  reentry_window: 10
  lambda_h: 0.4
  lambda_v: 0.3
  lambda_g: 0.5
  velocity_dt: 3
  graph_k: 4
prediction:
  horizons:
  - 5
  - 10
  gamma: 0.3
  graph_k: 4
eval:
  metrics:
  - HOTA
  - IDF1
  - AssA
  - MOTA
  - IDSW
  - DetA
  - FPS
  failure_modes:
  - crossing
  - short_occlusion
  - dense
  - open
  crossing_min_iou: 0.2
  occlusion_max_gap: 15
  density_high: 8
seed: 42
